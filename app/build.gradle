plugins { id 'com.android.application' }

android {
    namespace 'com.autoclicker.test'
    compileSdk 35

    defaultConfig {
        applicationId 'com.autoclicker.test'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '4.1'
    }

    buildTypes {
        debug {
            // Standard Android debug signing. No user keystore/password is required.
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
