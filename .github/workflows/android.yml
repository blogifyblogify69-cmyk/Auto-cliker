name: Android Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (for example v3.1.0)"
        required: true
        default: "v3.1.0"

permissions:
  contents: write

jobs:
  debug-validation:
    name: Debug validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  signed-release:
    name: Signed release APK and AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing RELEASE_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing RELEASE_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing RELEASE_KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/autoclicker-release.jks"
          chmod 600 "$RUNNER_TEMP/autoclicker-release.jks"

      - name: Build signed release APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/autoclicker-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean assembleRelease bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SDK_APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SDK_APKSIGNER"
          "$SDK_APKSIGNER" verify --verbose "$APK"

      - name: Generate checksums and build manifest
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/AutoClicker-v3.1.apk
          cp app/build/outputs/bundle/release/app-release.aab release/AutoClicker-v3.1.aab
          sha256sum release/AutoClicker-v3.1.apk > release/SHA256.txt
          sha256sum release/AutoClicker-v3.1.aab >> release/SHA256.txt
          cat > release/BUILD_INFO.txt <<EOF
          Application: Auto Clicker Test
          Application ID: com.autoclicker.test
          Version: 3.1
          Version Code: 5
          Commit: $GITHUB_SHA
          Signed APK: AutoClicker-v3.1.apk
          Signed AAB: AutoClicker-v3.1.aab
          EOF

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-v3.1-release
          path: release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG"             release/AutoClicker-v3.1.apk             release/AutoClicker-v3.1.aab             release/SHA256.txt             release/BUILD_INFO.txt             --title "Auto Clicker Test $TAG"             --generate-notes
