name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build and verify debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ubuntu-latest already provides the Android SDK/toolchain needed by
      # this minimal Android project. Avoid the extra setup-android action,
      # which was the failing step in the previous workflow runs.
      - name: Check Android toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -n 5 || true
          ls "$ANDROID_HOME/build-tools" | tail -n 5 || true

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-debug-v4.1
          path: app/build/outputs/apk/debug/app-debug.apk
