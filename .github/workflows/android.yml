name: Android Portable Virtual QA APK — v5.4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build and verify universal portable QA APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check Android toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Run unit tests
        run: gradle test --stacktrace
      - name: Run Android lint
        run: gradle lintDebug --stacktrace
      - name: Build universal debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signing
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect APK package
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -F "package: name='com.autoclicker.virtualtest' versionCode='14' versionName='5.4-qa'" /tmp/apk-badging.txt
          grep -F "launchable-activity: name='com.autoclicker.test.MainActivity'" /tmp/apk-badging.txt
          ! "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -E "android.permission.(SYSTEM_ALERT_WINDOW|BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE)"
      - name: Upload portable QA APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Portable-QA-v5.4
          path: app/build/outputs/apk/debug/app-debug.apk
